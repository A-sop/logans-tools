# Installed by logans-tools ops/ln02/install-ln02-checkout-sync.sh (RR-010 step 0).
# Div1 artifacts_indexed reads a dedicated DABOS clone fetched from GitHub after the Thu 14:00 close.
# Ship-log/validation/establishment inputs stay on the Seagate mirror (DABOS_REPO_ROOT, set by the wrapper).
# No secret here. A failed pre-sync ("-") does not stop the close; Div1 is then NOT POSTED with a reason.
[Service]
Environment=DABOS_WIKI_REPO_ROOT=%h/Dev/DABOS-weekclose
ExecStartPre=-/usr/bin/env SYNC_REPOS=%h/Dev/DABOS-weekclose SYNC_FROM_WEEK_CLOSE=1 %h/bin/dabos-checkout-sync.sh
